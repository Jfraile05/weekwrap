AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: WeekWrap - turns a week of GitHub activity into a drafted weekly update.

Parameters:
  DefaultUsername:
    Type: String
    Default: ""
    Description: GitHub username used by the weekly scheduled run. Leave empty to disable it.
  ModelId:
    Type: String
    Default: us.amazon.nova-lite-v1:0
    Description: Bedrock inference profile used for drafting.
  ScheduleExpression:
    Type: String
    Default: cron(0 21 ? * FRI *)
    Description: When the weekly run fires. Default is Friday 21:00 UTC (5pm ET).
  AppUrl:
    Type: String
    Default: https://localhost/
    Description: Public URL of the app, with the trailing slash. Cognito redirects back here after sign-in. Deploy once, copy the AppUrl output here, then deploy again.

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 60
    MemorySize: 512
    Architectures: [arm64]

Resources:
  WrapsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: username
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: username
          KeyType: HASH
        - AttributeName: createdAt
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  ProfilesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: weekwrap
      UserPoolTier: ESSENTIALS
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub weekwrap-${AWS::AccountId}

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      SupportedIdentityProviders: [COGNITO]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email]
      CallbackURLs: [!Ref AppUrl]
      LogoutURLs: [!Ref AppUrl]
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true

  WeekWrapFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: cjs
        Minify: false
        Target: node22
        Sourcemap: false
        EntryPoints: [src/handler.ts]
    Properties:
      Handler: handler.handler
      CodeUri: ./
      Environment:
        Variables:
          TABLE_NAME: !Ref WrapsTable
          PROFILES_TABLE_NAME: !Ref ProfilesTable
          MODEL_ID: !Ref ModelId
          DEFAULT_USERNAME: !Ref DefaultUsername
          USER_POOL_ID: !Ref UserPool
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
          COGNITO_DOMAIN: !Sub ${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com
      FunctionUrlConfig:
        AuthType: NONE
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref WrapsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ProfilesTable
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${ModelId}
                - arn:aws:bedrock:*::foundation-model/amazon.nova-lite-v1:0
      Events:
        WeeklyRun:
          Type: Schedule
          Properties:
            Schedule: !Ref ScheduleExpression
            Description: Drafts the weekly update without being asked.
            Input: '{"scheduled": true}'

Outputs:
  AppUrl:
    Description: Public URL of the WeekWrap app.
    Value: !GetAtt WeekWrapFunctionUrl.FunctionUrl
  FunctionName:
    Description: Lambda function name, useful for manual invokes.
    Value: !Ref WeekWrapFunction
  TableName:
    Description: DynamoDB table holding saved wraps.
    Value: !Ref WrapsTable
  ProfilesTableName:
    Description: DynamoDB table holding the GitHub username each person has linked.
    Value: !Ref ProfilesTable
  UserPoolId:
    Description: Cognito user pool. Add the cohort here (Users, Create user).
    Value: !Ref UserPool
